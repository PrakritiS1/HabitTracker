<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker Pro - Annual Calendar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --secondary: #6366f1;
            --accent: #f97316;
            --dark-bg: #0a0e27;
            --dark-surface: #1a1f3a;
            --dark-surface-light: #242d4a;
            --text-primary: #f5f7fa;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #0f1a35 50%, #1a0a2e 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 212, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 40% 40%, rgba(249, 115, 22, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
            animation: gradientShift 15s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-family: 'Sora', sans-serif;
            font-size: 3.5em;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 1.15em;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            animation: slideUp 0.8s ease-out;
            animation-fill-mode: both;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.15);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85em;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 2.8em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .stat-subtext {
            color: var(--text-secondary);
            font-size: 0.9em;
            font-weight: 300;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .controls input {
            flex: 1;
            min-width: 250px;
            padding: 16px 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 1em;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .controls input::placeholder {
            color: var(--text-secondary);
        }

        .controls input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .controls button {
            padding: 16px 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .controls button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s;
        }

        .controls button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
        }

        .controls button:hover::before {
            left: 100%;
        }

        /* Habits Container */
        .habits-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-family: 'Sora', sans-serif;
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-primary);
            animation: fadeInDown 0.8s ease-out 0.3s both;
        }

        /* Individual Habit Card */
        .habit-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(0, 212, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 40px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .habit-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: all 0.4s;
        }

        .habit-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.5);
            transform: translateY(-8px);
            box-shadow: 0 30px 60px rgba(0, 212, 255, 0.2);
        }

        .habit-card:hover::before {
            opacity: 1;
            top: -25%;
            right: -25%;
        }

        .habit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .habit-name {
            font-family: 'Sora', sans-serif;
            font-size: 2em;
            font-weight: 700;
            color: var(--text-primary);
        }

        .habit-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            padding: 10px 20px;
            border: 1.5px solid;
            background: transparent;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85em;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .reset-btn {
            border-color: rgba(99, 102, 241, 0.5);
            color: var(--secondary);
        }

        .reset-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .delete-btn {
            border-color: rgba(239, 68, 68, 0.5);
            color: var(--danger);
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
        }

        /* Progress Section */
        .progress-section {
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .progress-label {
            color: var(--text-secondary);
            font-size: 0.9em;
            font-weight: 500;
        }

        .progress-percentage {
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .progress-bar-container {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 10px;
            animation: progressFill 1s ease-out;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        @keyframes progressFill {
            from {
                width: 0;
            }
        }

        /* Stats Row */
        .habit-stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 35px;
            position: relative;
            z-index: 1;
        }

        .habit-stat {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .habit-stat-label {
            color: var(--text-secondary);
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .habit-stat-value {
            font-size: 2em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Year Grid - All 12 months */
        .year-grid-container {
            margin-top: 35px;
            position: relative;
            z-index: 1;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
        }

        .month-column {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            transition: all 0.3s;
        }

        .month-column:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .month-header {
            font-weight: 700;
            font-size: 0.95em;
            margin-bottom: 15px;
            color: var(--primary);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s cubic-bezier(0.23, 1, 0.320, 1);
            position: relative;
        }

        .day-cell:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.6);
            transform: scale(1.15);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }

        .day-cell.completed {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-color: var(--primary);
            color: white;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
            animation: popIn 0.4s cubic-bezier(0.23, 1, 0.320, 1);
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }

        .day-cell.completed::after {
            content: '✓';
            position: absolute;
            font-size: 0.9em;
        }

        /* Empty State */
        .no-habits {
            text-align: center;
            padding: 80px 40px;
            animation: fadeIn 0.1s ease-out 0.1s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .no-habits-icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .no-habits-text {
            font-size: 1.3em;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95em;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2em;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .controls {
                flex-direction: column;
            }

            .controls input,
            .controls button {
                width: 100%;
            }

            .habit-name {
                font-size: 1.5em;
            }

            .year-grid {
                grid-template-columns: 1fr;
            }

            .habit-stats-row {
                grid-template-columns: 1fr;
            }
        }
        
    </style>
</head>
<body>
<div class="click">

    <button onclick="logout()">Logout</button>
    /<div>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📅 Habit Tracker Pro</h1>
            <p>Master your daily habits with elegant design and comprehensive analytics</p>
        </div>

        

        <!-- Stats Grid -->
        <div class="stats-grid" id="statsGrid"></div>

        <!-- Controls -->
        <div class="controls">
            <input type="text" id="habitName" placeholder="Add a new habit... (e.g., Exercise, Meditation, Reading)" onkeypress="if(event.key === 'Enter') addHabit()">
            <button onclick="addHabit()">+ Add Habit</button>
        </div>

        <!-- Habits Section -->
        <div class="habits-section">
            <h2 class="section-title">Your Habits</h2>
            <div id="habitsContainer"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            ✨ All data is automatically saved and protected in your browser
        </div>
    </div>

    <script>

        // Protect page - only logged in users allowed
window.addEventListener("DOMContentLoaded", function () {
    const session = JSON.parse(localStorage.getItem("habitTrackerSession"));
    if (!session) {
        alert("Please login first!");
        window.location.href = "llogin.html";
    }
});


        const currentYear = new Date().getFullYear();
        const habits = {};

        // Load data from localStorage
        function loadData() {
            const saved = localStorage.getItem('habitTrackerYearlyAnimated');
            if (saved) {
                const data = JSON.parse(saved);
                Object.assign(habits, data);
            }
        }

        // Save data to localStorage
        function saveData() {
            localStorage.setItem('habitTrackerYearlyAnimated', JSON.stringify(habits));
            renderAll();
        }

        // Add a new habit
        function addHabit() {
            const input = document.getElementById('habitName');
            const habitName = input.value.trim();

            if (!habitName) {
                alert('Please enter a habit name');
                return;
            }

            if (habits[habitName]) {
                alert('This habit already exists');
                return;
            }

            habits[habitName] = {};
            input.value = '';
            saveData();
        }

        // Toggle day completion
        function toggleDay(habitName, dayKey) {
            if (!habits[habitName]) return;

            if (habits[habitName][dayKey]) {
                delete habits[habitName][dayKey];
            } else {
                habits[habitName][dayKey] = true;
            }
            saveData();
        }

        // Delete a habit - FIXED
        function deleteHabit(habitName) {
            if (confirm(`Are you sure you want to delete "${habitName}"? This cannot be undone.`)) {
                delete habits[habitName];
                saveData();
            }
        }

        // Reset habit data - FIXED
        function resetHabit(habitName) {
            if (confirm(`Reset all progress for "${habitName}"? This cannot be undone.`)) {
                habits[habitName] = {};
                saveData();
            }
        }

        // Get days in month
        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }

        // Get month name
        function getMonthName(month) {
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                          'July', 'August', 'September', 'October', 'November', 'December'];
            return months[month];
        }

        // Create habit card with full year calendar
        function createHabitCard(habitName, completedDays) {
            const completed = Object.keys(completedDays).length;
            const percentage = Math.round((completed / 365) * 100);

            // Build year grid
            let yearGridHtml = '<div class="year-grid-container"><div class="year-grid">';

            for (let month = 0; month < 12; month++) {
                const monthName = getMonthName(month);
                const daysInMonth = getDaysInMonth(currentYear, month);
                
                yearGridHtml += `<div class="month-column">
                    <div class="month-header">${monthName.substring(0, 3)}</div>
                    <div class="days-grid">`;

                for (let day = 1; day <= daysInMonth; day++) {
                    const dayKey = day + '-' + (month + 1);
                    const isCompleted = completedDays[dayKey] ? 'completed' : '';
                    
                    yearGridHtml += `<div class="day-cell ${isCompleted}" 
                        onclick="toggleDay('${habitName}', '${dayKey}')"
                        title="${monthName} ${day}"></div>`;
                }

                // Add empty cells for alignment
                const firstDay = new Date(currentYear, month, 1).getDay();
                for (let i = firstDay; i < 7 && daysInMonth < 28; i++) {
                    yearGridHtml += `<div class="day-cell" style="opacity: 0;"></div>`;
                }

                yearGridHtml += `</div></div>`;
            }

            yearGridHtml += '</div></div>';

            return `
                <div class="habit-card">
                    <div class="habit-header">
                        <div class="habit-name">${habitName}</div>
                        <div class="habit-actions">
                            <button class="action-btn reset-btn" onclick="resetHabit('${habitName}')">Reset</button>
                            <button class="action-btn delete-btn" onclick="deleteHabit('${habitName}')">Delete</button>
                        </div>
                    </div>

                    <div class="habit-stats-row">
                        <div class="habit-stat">
                            <div class="habit-stat-label">Days Completed</div>
                            <div class="habit-stat-value">${completed}</div>
                        </div>
                        <div class="habit-stat">
                            <div class="habit-stat-label">Days Remaining</div>
                            <div class="habit-stat-value">${365 - completed}</div>
                        </div>
                        <div class="habit-stat">
                            <div class="habit-stat-label">Year Progress</div>
                            <div class="habit-stat-value">${percentage}%</div>
                        </div>
                    </div>

                    <div class="progress-section">
                        <div class="progress-header">
                            <span class="progress-label">Annual Progress</span>
                            <span class="progress-percentage">${percentage}%</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: ${percentage}%"></div>
                        </div>
                    </div>

                    ${yearGridHtml}
                </div>
            `;
        }

        // Update stats
        function updateStats() {
            const statsGrid = document.getElementById('statsGrid');
            let totalHabits = Object.keys(habits).length;
            let totalCompleted = 0;
            let todayCompleted = 0;

            const today = new Date();
            const todayKey = today.getDate() + '-' + (today.getMonth() + 1);

            for (const habitName in habits) {
                totalCompleted += Object.keys(habits[habitName]).length;
                if (habits[habitName][todayKey]) {
                    todayCompleted++;
                }
            }

            const maxPossible = totalHabits * 365;
            const percentage = maxPossible > 0 ? Math.round((totalCompleted / maxPossible) * 100) : 0;

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Active Habits</div>
                    <div class="stat-value">${totalHabits}</div>
                    <div class="stat-subtext">Habits in progress</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Completions</div>
                    <div class="stat-value">${totalCompleted}</div>
                    <div class="stat-subtext">Days marked done</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Today's Status</div>
                    <div class="stat-value">${todayCompleted}/${totalHabits}</div>
                    <div class="stat-subtext">Habits today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Year Progress</div>
                    <div class="stat-value">${percentage}%</div>
                    <div class="stat-subtext">Overall completion</div>
                </div>
            `;
        }

        // Render all
        function renderAll() {
            updateStats();

            const habitsContainer = document.getElementById('habitsContainer');

            if (Object.keys(habits).length === 0) {
                habitsContainer.innerHTML = `
                    <div class="no-habits">
                        <div class="no-habits-icon">📝</div>
                        <div class="no-habits-text">Start building better habits today</div>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const habitName in habits) {
                html += createHabitCard(habitName, habits[habitName]);
            }

            habitsContainer.innerHTML = html;
        }

        // Initialize
        loadData();
        renderAll();

        // Auto-save
        window.addEventListener('beforeunload', saveData);
   
   
   
   function logout() {
    localStorage.removeItem("habitTrackerSession");
    window.location.href = "llogin.html";
}

</script>
</body>
</html>
